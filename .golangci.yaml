version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - govet
    - gocognit
    - gocyclo
    - ineffassign
    - misspell
    - unconvert
    - unused
    - staticcheck
    - modernize
    - testifylint
    - whitespace
  settings:
    gocyclo:
      # Top 3 (gocyclo -top 15 -avg ., 2026-09-09):
      #   1. 21 (*RpcPlugin).discoverRoutesBySelector (pkg/plugin/plugin.go:241)
      #   2. 18 (*RpcPlugin).setHTTPHeaderRoute (pkg/plugin/httproute.go:74),
      #      (*RpcPlugin).setGRPCHeaderRoute (pkg/plugin/grpcroute.go:69)
      #   3. 11 ensureInProgressLabel (pkg/plugin/labels.go:9),
      #      (*RpcPlugin).setHTTPRouteWeight (pkg/plugin/httproute.go:18)
      min-complexity: 25
    gocognit:
      # Top 3 (gocognit -top 15 -avg -ignore vendor/ .,
      # 2026-09-09):
      #   1. 43 (*RpcPlugin).setGRPCHeaderRoute (pkg/plugin/grpcroute.go:69),
      #      (*RpcPlugin).setHTTPHeaderRoute (pkg/plugin/httproute.go:74)
      #   2. 36 (*RpcPlugin).discoverRoutesBySelector (pkg/plugin/plugin.go:241)
      #   3. 23 TestSetGRPCHeaderRouteWithMethodAndHeaders
      #      (pkg/plugin/plugin_test.go:1588)
      min-complexity: 50
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
    modernize:
      disable:
        - omitzero
        - newexpr
    testifylint:
      enable-all: true
      disable:
        - go-require
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
