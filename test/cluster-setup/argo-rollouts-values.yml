controller:
  nodeSelector:
    argo-rollouts-controller: "true"

  replicas: 1

  # Pin the controller image to a release newer than the chart's appVersion.
  # Needed for pingPong (argoproj/argo-rollouts#4740), first shipped in v1.10.0 —
  # no Helm chart with that appVersion exists yet.
  image:
    tag: v1.10.0

  logging:
    level: debug

  volumes:
    - name: gatewayapi-plugin
      hostPath:
        path: /Volumes/
        type: Directory

  volumeMounts:
    - mountPath: /argo-rollouts-gatewayapi-plugin/
      name: gatewayapi-plugin

  trafficRouterPlugins:
    - name: "argoproj-labs/gatewayAPI"
      location: "file:///argo-rollouts-gatewayapi-plugin/gatewayapi-plugin-linux-amd64"

providerRBAC:
  providers:
    istio: false
    smi: false
    ambassador: false
    awsLoadBalancerController: false
    awsAppMesh: false
    apisix: false
    contour: false
    glooPlatform: false
