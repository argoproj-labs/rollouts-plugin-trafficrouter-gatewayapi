apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-unmanaged-rule
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
  rules:
    - name: rollout-weighted
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httproute-unmanaged-rule-stable-service
          port: 80
        - name: httproute-unmanaged-rule-canary-service
          port: 80
    # User-defined rule, NOT managed by the plugin (not part of managedRoutes).
    # It happens to route 100% of its traffic to the canary service via a
    # single BackendRef, which is exactly what issue #217 is about: the plugin
    # must not confuse this with a rule it injected itself.
    - name: query-param-canary
      matches:
        - path:
            type: PathPrefix
            value: /
          queryParams:
            - type: Exact
              name: canary
              value: "true"
      backendRefs:
        - name: httproute-unmanaged-rule-canary-service
          port: 80
          weight: 100
