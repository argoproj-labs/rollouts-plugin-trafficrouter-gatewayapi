apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-unmanaged-rule
  namespace: default
spec:
  (length(rules)): 2
  rules:
    - name: rollout-weighted
      backendRefs:
        - name: httproute-unmanaged-rule-stable-service
          (weight): 70
        - name: httproute-unmanaged-rule-canary-service
          (weight): 30
    - name: query-param-canary
      matches:
        - path:
            type: PathPrefix
            value: /
          queryParams:
            - type: Exact
              name: canary
              value: "true"
      backendRefs:
        - name: httproute-unmanaged-rule-canary-service
          (weight): 100
