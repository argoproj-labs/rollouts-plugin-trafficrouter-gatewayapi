apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: httproute-unmanaged-rule
  labels:
    route-type: http
spec:
  description: >
    Reproduces issue #217: a user-defined HTTPRoute rule that is not part of
    spec.strategy.canary.trafficRouting.managedRoutes, but happens to route
    100% of its traffic to the canary service via a single BackendRef (e.g. a
    manual query-param-based canary rule), must survive the rollout's full
    lifecycle. The plugin's "is this rule mine?" check must not misidentify
    such rules as plugin-injected header routes and delete them once the
    rollout is fully promoted.
  # Uses 'default' namespace so the gateway (traefik-gateway) is accessible.
  namespace: default
  concurrent: true

  steps:
    - name: create-resources
      description: Create the HTTPRoute (with an extra unmanaged query-param-canary rule) and Rollout.
      try:
        - apply:
            file: resources/services.yaml
        - apply:
            file: resources/httproute.yaml
        - apply:
            file: resources/rollout.yaml

    - name: assert-initial-state
      description: Plugin initializes the weighted rule; the unmanaged query-param-canary rule must be untouched.
      try:
        - assert:
            timeout: 30s
            file: assertions/httproute-initial.yaml

    - name: wait-for-initial-healthy
      description: Wait for the initial rollout to reach Healthy before triggering a canary.
      try:
        - assert:
            timeout: 5m
            file: assertions/rollout-healthy.yaml

    - name: trigger-canary
      description: Update the rollout image to start a canary (setWeight:30 -> pause:30s).
      try:
        - patch:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Rollout
              metadata:
                name: httproute-unmanaged-rule-rollout
                namespace: default
              spec:
                template:
                  spec:
                    containers:
                      - name: rollouts-demo
                        image: argoproj/rollouts-demo:green

    - name: assert-canary-weight-active
      description: Plugin must have set canary weight to 30/70; the unmanaged query-param-canary rule must remain untouched mid-canary.
      try:
        - assert:
            timeout: 2m
            file: assertions/httproute-canary.yaml

    - name: assert-rollout-healthy
      description: Wait for the canary to complete (30s pause auto-expires) and the rollout to be fully promoted.
      try:
        - assert:
            timeout: 5m
            file: assertions/rollout-healthy.yaml

    - name: assert-unmanaged-rule-survives-cleanup
      description: >
        Once the rollout is fully promoted, Argo Rollouts core calls
        RemoveManagedRoutes(). The plugin must reset the weighted rule but
        must NOT remove the unrelated query-param-canary rule.
      try:
        - assert:
            timeout: 60s
            file: assertions/httproute-after-cleanup.yaml
